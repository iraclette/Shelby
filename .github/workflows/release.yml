name: Release Shop Console

# Push a vX.Y.Z tag to build and publish a release; the app's self-updater reads these.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt
        # tools_mingw1310 is the actual compiler; win64_mingw alone only pulls runtime DLLs.
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          arch: "win64_mingw"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"

      - name: Locate MinGW toolchain
        # Put MinGW's g++ first on PATH so CMake doesn't pick up MSVC.
        shell: pwsh
        run: |
          Write-Host "IQTA_TOOLS = $env:IQTA_TOOLS"
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
          Write-Host "RUNNER_TOOL_CACHE = $env:RUNNER_TOOL_CACHE"

          $candidates = @(
            $env:IQTA_TOOLS,
            $(if ($env:QT_ROOT_DIR) { Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent }),
            $(if ($env:GITHUB_WORKSPACE) { Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "Qt" }),
            "C:\Qt",
            "D:\a"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $gxx = $null
          foreach ($root in $candidates) {
            Write-Host "Searching for g++.exe under $root ..."
            $found = Get-ChildItem -Path $root -Recurse -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $gxx = $found; break }
          }

          if (-not $gxx) {
            Write-Host "::error::Could not find g++.exe under any candidate root. Dumping diagnostics for the next fix:"
            foreach ($root in ($candidates + @("D:\a\Shelby\Qt", "C:\Qt"))) {
              if (Test-Path $root) {
                Write-Host "--- Top-level contents of $root ---"
                Get-ChildItem -Path $root -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
                Write-Host "--- Full recursive listing of $root (dirs only, depth-limited) ---"
                Get-ChildItem -Path $root -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
              }
            }
            throw "Could not find g++.exe — see diagnostics above."
          }

          Write-Host "Found MinGW toolchain at $($gxx.DirectoryName)"
          Add-Content $env:GITHUB_PATH $gxx.DirectoryName
          Add-Content $env:GITHUB_ENV "MINGW_BIN=$($gxx.DirectoryName)"

      - name: Configure
        # Bakes the Supabase URL + publishable key (repo variables) into the exe.
        shell: pwsh
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) {
            throw "Repository variables SUPABASE_URL and SUPABASE_ANON_KEY must be set."
          }
          cmake -S apps/shop-console -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DBUILTIN_SUPABASE_URL=$env:SUPABASE_URL" `
            "-DBUILTIN_SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"

      - name: Build
        run: cmake --build build

      - name: Deploy Qt dependencies
        # windeployqt doesn't copy the exe itself. Missing tls\ = broken HTTPS.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ShopConsole | Out-Null
          Copy-Item build\ShopConsole.exe dist\ShopConsole\
          windeployqt dist\ShopConsole\ShopConsole.exe --release --no-translations

      - name: Bundle MinGW runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "$env:MINGW_BIN\libstdc++-6.dll" dist\ShopConsole\
          Copy-Item "$env:MINGW_BIN\libgcc_s_seh-1.dll" dist\ShopConsole\
          Copy-Item "$env:MINGW_BIN\libwinpthread-1.dll" dist\ShopConsole\

      - name: Zip release folder
        shell: pwsh
        run: |
          Copy-Item apps\shop-console\.env.example dist\ShopConsole\
          Copy-Item apps\shop-console\scripts\update.ps1 dist\ShopConsole\
          Compress-Archive -Path dist\ShopConsole\* -DestinationPath ShopConsole-windows.zip

      - name: Build installer
        # Single-file installer; the self-updater only uses the zip.
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$PWD\dist\ShopConsole" `
            "/O$PWD" `
            apps\shop-console\installer\ShopConsole.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Tags like v1.4.1-rc1 become pre-releases, which the self-updater ignores.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ShopConsole-windows.zip
            ShopConsole-Setup.exe
