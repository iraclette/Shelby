name: Release Shop Console

# Push a version tag (vX.Y.Z) to build the Shop Console and publish it as a
# GitHub Release. The app checks this same Releases API on launch — see
# apps/shop-console/src/UpdateChecker.cpp — so this is what feeds it.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt
        # --autodesktop (the action's default) pulls in the matching MinGW
        # toolchain automatically alongside win64_mingw — no separate
        # `tools:` install needed (and the explicit tool-variant name for
        # this isn't actually resolvable via aqt install-tool; confirmed by
        # a failed CI run before removing this).
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          arch: "win64_mingw"

      - name: Locate MinGW toolchain
        # Searches for it rather than hardcoding the exact folder name (e.g.
        # "mingw1310_64") — that's tied to a specific MinGW point release
        # bundled with this Qt version, not something worth hand-pinning
        # here. install-qt-action's default output dir is a "Qt" folder
        # next to the checkout (confirmed from an earlier run's log:
        # `--outputdir D:\a\Shelby\Qt` alongside `D:\a\Shelby\Shelby`).
        # windows-latest also has MSVC installed, so this also matters for
        # correctness, not just convenience — without MinGW's g++ on PATH
        # first, CMake can pick up cl.exe instead and fail to link against
        # MinGW-built Qt.
        shell: pwsh
        run: |
          $qtRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "Qt"
          $gxx = Get-ChildItem -Path $qtRoot -Recurse -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gxx) { throw "Could not find g++.exe under $qtRoot" }
          Write-Host "Found MinGW toolchain at $($gxx.DirectoryName)"
          Add-Content $env:GITHUB_PATH $gxx.DirectoryName
          Add-Content $env:GITHUB_ENV "MINGW_BIN=$($gxx.DirectoryName)"

      - name: Configure
        run: cmake -S apps/shop-console -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          windeployqt build\ShopConsole.exe --release --no-translations

      - name: Bundle MinGW runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "$env:MINGW_BIN\libstdc++-6.dll" build\
          Copy-Item "$env:MINGW_BIN\libgcc_s_seh-1.dll" build\
          Copy-Item "$env:MINGW_BIN\libwinpthread-1.dll" build\

      - name: Zip release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ShopConsole | Out-Null
          Copy-Item build\ShopConsole.exe dist\ShopConsole\
          Copy-Item build\*.dll dist\ShopConsole\
          Copy-Item -Recurse build\platforms dist\ShopConsole\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\styles dist\ShopConsole\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\imageformats dist\ShopConsole\ -ErrorAction SilentlyContinue
          Copy-Item apps\shop-console\.env.example dist\ShopConsole\
          Compress-Archive -Path dist\ShopConsole\* -DestinationPath ShopConsole-windows.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ShopConsole-windows.zip
