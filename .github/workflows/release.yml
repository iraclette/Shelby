name: Release Shop Console

# Push a version tag (vX.Y.Z) to build the Shop Console and publish it as a
# GitHub Release. The app checks this same Releases API on launch — see
# apps/shop-console/src/UpdateChecker.cpp — so this is what feeds it.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt
        # win64_mingw's own automatic dependency install only pulls in a
        # small MinGW *runtime* (a few DLLs) — not the actual compiler.
        # The full ~112MB compiler toolchain is a separate package, verified
        # directly against Qt's real package index (not guessed):
        # https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/tools_mingw1310/Updates.xml
        # lists it as tool category "tools_mingw1310", variant
        # "qt.tools.win64_mingw1310" — note the category is version-suffixed
        # ("tools_mingw1310"), not the generic "tools_mingw" a previous
        # attempt used (which only goes up to MinGW 8.1.0 and doesn't
        # contain this variant at all — why that attempt failed outright).
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          arch: "win64_mingw"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"

      - name: Locate MinGW toolchain
        # windows-latest also has MSVC installed, so finding MinGW's g++
        # matters for correctness, not just convenience — without it on
        # PATH first, CMake can pick up cl.exe instead and fail to link
        # against MinGW-built Qt.
        #
        # This has taken multiple guesses to get right (IQTA_TOOLS per the
        # action's own source; a GITHUB_WORKSPACE-relative path before
        # that) and both came up empty against the real runner, for reasons
        # that aren't visible without a log download this environment can't
        # authenticate for. Rather than guess a third location, this
        # searches every plausible root AND — if none of them work — dumps
        # enough of the actual runner filesystem into the log to fix this
        # for real on the next attempt instead of guessing again.
        shell: pwsh
        run: |
          Write-Host "IQTA_TOOLS = $env:IQTA_TOOLS"
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
          Write-Host "RUNNER_TOOL_CACHE = $env:RUNNER_TOOL_CACHE"

          $candidates = @(
            $env:IQTA_TOOLS,
            $(if ($env:QT_ROOT_DIR) { Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent }),
            $(if ($env:GITHUB_WORKSPACE) { Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "Qt" }),
            "C:\Qt",
            "D:\a"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $gxx = $null
          foreach ($root in $candidates) {
            Write-Host "Searching for g++.exe under $root ..."
            $found = Get-ChildItem -Path $root -Recurse -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $gxx = $found; break }
          }

          if (-not $gxx) {
            Write-Host "::error::Could not find g++.exe under any candidate root. Dumping diagnostics for the next fix:"
            foreach ($root in ($candidates + @("D:\a\Shelby\Qt", "C:\Qt"))) {
              if (Test-Path $root) {
                Write-Host "--- Top-level contents of $root ---"
                Get-ChildItem -Path $root -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
                Write-Host "--- Full recursive listing of $root (dirs only, depth-limited) ---"
                Get-ChildItem -Path $root -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
              }
            }
            throw "Could not find g++.exe — see diagnostics above."
          }

          Write-Host "Found MinGW toolchain at $($gxx.DirectoryName)"
          Add-Content $env:GITHUB_PATH $gxx.DirectoryName
          Add-Content $env:GITHUB_ENV "MINGW_BIN=$($gxx.DirectoryName)"

      - name: Configure
        run: cmake -S apps/shop-console -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          windeployqt build\ShopConsole.exe --release --no-translations

      - name: Bundle MinGW runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "$env:MINGW_BIN\libstdc++-6.dll" build\
          Copy-Item "$env:MINGW_BIN\libgcc_s_seh-1.dll" build\
          Copy-Item "$env:MINGW_BIN\libwinpthread-1.dll" build\

      - name: Zip release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ShopConsole | Out-Null
          Copy-Item build\ShopConsole.exe dist\ShopConsole\
          Copy-Item build\*.dll dist\ShopConsole\
          Copy-Item -Recurse build\platforms dist\ShopConsole\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\styles dist\ShopConsole\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\imageformats dist\ShopConsole\ -ErrorAction SilentlyContinue
          Copy-Item apps\shop-console\.env.example dist\ShopConsole\
          Copy-Item apps\shop-console\scripts\update.ps1 dist\ShopConsole\
          Compress-Archive -Path dist\ShopConsole\* -DestinationPath ShopConsole-windows.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ShopConsole-windows.zip
